name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Installs the exact Chromium and Firefox revisions that the locked playwright-core expects.
      - run: npx playwright-core install --with-deps chromium firefox
      - name: Chromium end-to-end
        run: npm run test:e2e:chromium
      - name: Firefox end-to-end
        run: npm run test:e2e:firefox
