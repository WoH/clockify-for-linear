name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check Chrome CRX packaging
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/crx-test.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$work/key.pem" 2>/dev/null
          id=$(openssl pkey -in "$work/key.pem" -pubout -outform DER 2>/dev/null | sha256sum | cut -c1-32 | tr '0123456789abcdef' 'abcdefghijklmnop')
          scripts/package-crx.sh dist/chrome "$work/key.pem" "$id" "$work/extension.crx"
          wrong=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          if [[ "$id" = "$wrong" ]]; then wrong=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb; fi
          if scripts/package-crx.sh dist/chrome "$work/key.pem" "$wrong" "$work/wrong.crx"; then
            echo "A mismatched signing key was accepted." >&2
            exit 1
          fi
          test ! -e "$work/wrong.crx"
      # Installs the exact Chromium and Firefox revisions that the locked playwright-core expects.
      - run: npx playwright-core install --with-deps chromium firefox
      - name: Check Firefox signature enforcement
        run: node scripts/verify-firefox-signature.ts --self-test
      - name: Chromium end-to-end
        run: npm run test:e2e:chromium
      - name: Firefox end-to-end
        run: npm run test:e2e:firefox
