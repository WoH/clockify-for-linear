name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package (fails if the tag differs from the package and manifest version)
        run: node scripts/package.ts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Sign Chrome CRX
        env:
          CHROME_CRX_PRIVATE_KEY: ${{ secrets.CHROME_CRX_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CHROME_CRX_PRIVATE_KEY"
          umask 077
          key=$(mktemp "$RUNNER_TEMP/chrome-signing.XXXXXX")
          trap 'rm -f -- "$key"' EXIT
          printf '%s\n' "$CHROME_CRX_PRIVATE_KEY" > "$key"
          scripts/package-crx.sh dist/chrome "$key" "$(< tools/chrome-extension-id)" \
            "release/clockify-for-linear-${GITHUB_REF_NAME#v}-chrome.crx"
      # create fails when the release already exists, so published assets are never overwritten.
      - name: Create draft release
        run: >
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.crx
          --verify-tag --draft --title "$GITHUB_REF_NAME"
          --notes "Chrome: the signed CRX is for self-hosted Linux distribution; the zip can be loaded unpacked. Firefox: the zip is unsigned until Mozilla signs it as an unlisted add-on."
        env:
          GH_TOKEN: ${{ github.token }}
